<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>账本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; min-height: 100vh; min-height: 100dvh; background: #f5f9fc; display: flex; justify-content: center; align-items: center; padding: 0; margin: 0; overflow: hidden; position: relative; }
        body::before { content: ''; position: fixed; top: -30%; left: -20%; width: 70%; height: 70%; background: radial-gradient(circle at 20% 30%, rgba(52,211,153,0.06) 0%, rgba(56,189,248,0.04) 40%, transparent 70%); border-radius: 50%; pointer-events: none; animation: floatGlow 16s ease-in-out infinite alternate; z-index: 0; filter: blur(60px); }
        body::after { content: ''; position: fixed; bottom: -20%; right: -15%; width: 60%; height: 60%; background: radial-gradient(circle at 70% 60%, rgba(56,189,248,0.05) 0%, rgba(52,211,153,0.03) 40%, transparent 70%); border-radius: 50%; pointer-events: none; animation: floatGlow 20s ease-in-out infinite alternate-reverse; z-index: 0; filter: blur(60px); }
        @keyframes floatGlow { 0% { transform: translate(0,0) scale(1); opacity:0.5; } 100% { transform: translate(30px,-20px) scale(1.1); opacity:0.8; } }
        .bubble { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; border: 1px solid rgba(255,255,255,0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: inset 0 -8px 30px rgba(255,255,255,0.2), 0 8px 40px rgba(52,211,153,0.03); animation: bubbleFloat 22s ease-in-out infinite alternate; }
        .bubble::after { content: ''; position: absolute; top: 12%; left: 22%; width: 35%; height: 22%; background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%); border-radius: 50%; transform: rotate(-25deg); }
        .bubble:nth-child(1) { width: 30vmin; height: 30vmin; top: 2%; left: -2%; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.3), rgba(52,211,153,0.03) 60%); animation-duration: 24s; }
        .bubble:nth-child(2) { width: 22vmin; height: 22vmin; bottom: 10%; right: 2%; background: radial-gradient(circle at 40% 25%, rgba(255,255,255,0.35), rgba(56,189,248,0.04) 60%); animation-duration: 28s; animation-delay: -5s; }
        .bubble:nth-child(3) { width: 14vmin; height: 14vmin; top: 40%; left: 80%; background: radial-gradient(circle at 35% 20%, rgba(255,255,255,0.4), rgba(52,211,153,0.04) 60%); animation-duration: 20s; animation-delay: -9s; }
        .bubble:nth-child(4) { width: 18vmin; height: 18vmin; top: 18%; right: 18%; background: radial-gradient(circle at 25% 20%, rgba(255,255,255,0.25), rgba(56,189,248,0.03) 60%); animation-duration: 26s; animation-delay: -3s; }
        @keyframes bubbleFloat { 0% { transform: translate(0,0) scale(1) rotate(0deg); opacity:0.4; } 100% { transform: translate(-20px,-25px) scale(1.06) rotate(6deg); opacity:0.8; } }
        .app-container { width: 100%; height: 100vh; height: 100dvh; background: rgba(255,255,255,0.50); backdrop-filter: blur(32px) saturate(1.6); -webkit-backdrop-filter: blur(32px) saturate(1.6); border-radius: 0; padding: 2.5vh 2.8vw 1.8vh; box-shadow: 0 20px 80px rgba(0,0,0,0.02), 0 8px 40px rgba(52,211,153,0.03), inset 0 1px 0 rgba(255,255,255,0.7); border: none; position: relative; z-index: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-fixed { flex-shrink: 0; position: relative; z-index: 2; }
        .bottom-fixed { flex-shrink: 0; position: relative; z-index: 2; padding-top: 1.2vh; margin: 0 -2.8vw; padding-left: 2.8vw; padding-right: 2.8vw; border-top: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); backdrop-filter: blur(4px); }
        .hero-illustration { display: flex; justify-content: center; align-items: center; padding: 0.2vh 0 0.6vh; position: relative; overflow: visible; height: clamp(50px, 12vh, 85px); }
        .hero-illustration svg { width: 100%; height: 100%; display: block; }
        .twinkle { animation: twinkle 2.4s ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.15; transform: scale(0.7); } 100% { opacity: 1; transform: scale(1.15); } }
        .stats-mini { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.2vw; margin-bottom: 1.2vh; }
        .stat-card { background: rgba(255,255,255,0.4); backdrop-filter: blur(12px); border-radius: clamp(14px, 4vw, 24px); padding: 1.4vh 0.5vw 1vh; text-align: center; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .stat-card .num { font-size: clamp(18px, 5.5vw, 30px); font-weight: 700; color: #0c4a6e; letter-spacing: -0.3px; line-height: 1.2; font-size-adjust: 0.5; }
        .stat-card .num.large-number { font-size: clamp(14px, 4.2vw, 24px); }
        .stat-card .num.income { color: #34d399; }
        .stat-card .num.expense { color: #f472b6; }
        .stat-card .label { font-size: clamp(9px, 2.4vw, 13px); color: #64748b; margin-top: 0.2vh; font-weight: 500; letter-spacing: 0.5px; }
        .month-nav { display: flex; justify-content: space-between; align-items: center; padding: 0.4vh 0 1.2vh; font-weight: 600; color: #0c4a6e; }
        .month-nav button { background: rgba(255,255,255,0.3); backdrop-filter: blur(12px); border: none; padding: 0.2vh 2.5vw; border-radius: 40px; font-size: clamp(16px, 4.5vw, 24px); cursor: pointer; color: #38bdf8; border: 1px solid rgba(255,255,255,0.3); line-height: 1.4; }
        .month-nav button:active { transform: scale(0.90); background: rgba(255,255,255,0.6); }
        .month-nav span { font-size: clamp(13px, 3.8vw, 18px); }
        .scroll-area { flex: 1; overflow-y: auto; margin: 0 -0.8vw; padding: 0 0.8vw; min-height: 0; position: relative; z-index: 1; }
        .scroll-area::-webkit-scrollbar { width: 3px; }
        .scroll-area::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #34d399, #22d3ee); border-radius: 10px; }
        .day-group { margin-bottom: 0.6vh; }
        .day-header { display: flex; justify-content: space-between; font-size: clamp(10px, 2.6vw, 13px); color: #64748b; padding: 0.4vh 0.6vw 0.2vh; font-weight: 500; border-bottom: 1px dashed rgba(52,211,153,0.12); margin-bottom: 0.4vh; }
        .bill-item { background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); border-radius: clamp(12px, 3.5vw, 20px); padding: 1vh 2.5vw; display: flex; align-items: center; gap: 2.5vw; margin-bottom: 0.4vh; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; transition: 0.15s; }
        .bill-item:active { transform: scale(0.97); background: rgba(255,255,255,0.7); }
        .bill-icon { width: clamp(28px, 7vw, 40px); height: clamp(28px, 7vw, 40px); border-radius: clamp(10px, 2.8vw, 16px); display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 4vw, 22px); background: rgba(240,249,255,0.3); flex-shrink: 0; }
        .bill-icon.income { background: rgba(209,250,229,0.3); }
        .bill-info { flex: 1; min-width: 0; }
        .bill-category { font-weight: 600; color: #0c4a6e; font-size: clamp(12px, 3.2vw, 16px); }
        .bill-note { font-size: clamp(9px, 2.2vw, 12px); color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bill-amount { font-weight: 700; font-size: clamp(12px, 3.2vw, 16px); flex-shrink: 0; }
        .bill-amount.income { color: #34d399; }
        .bill-amount.expense { color: #f472b6; }
        .empty-state { text-align: center; padding: 6vh 4vw; color: #64748b; }
        .empty-state .emoji { font-size: clamp(28px, 8vw, 44px); display: block; margin-bottom: 0.8vh; }
        .empty-state span { font-size: clamp(11px, 2.8vw, 15px); }
        .fab { display: block; width: 100%; padding: 1.6vh 0; border: none; border-radius: 40px; background: linear-gradient(135deg, #34d399, #22d3ee); color: white; font-size: clamp(16px, 4.2vw, 22px); font-weight: 600; box-shadow: 0 8px 40px rgba(52,211,153,0.12), 0 4px 24px rgba(34,211,238,0.08); cursor: pointer; transition: 0.25s; letter-spacing: 1px; position: relative; overflow: hidden; }
        .fab::before { content: ''; position: absolute; top: -60%; left: -30%; width: 120%; height: 120%; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.25), transparent 50%); pointer-events: none; }
        .fab:active { transform: scale(0.95); }
        .bottom-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.2vw; margin-top: 1vh; padding-bottom: 0.4vh; }
        .bottom-actions .action-btn { background: rgba(255,255,255,0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); border-radius: clamp(20px, 6vw, 36px); padding: 1vh 0; font-size: clamp(11px, 2.8vw, 15px); font-weight: 500; color: #0c4a6e; text-align: center; cursor: pointer; transition: 0.15s; }
        .bottom-actions .action-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.7); }
        .bottom-actions .action-btn .icon { display: block; font-size: clamp(16px, 4.5vw, 24px); }
        .bottom-actions .action-btn .label { font-size: clamp(9px, 2.2vw, 12px); color: #64748b; }
        .book-wrapper { position: relative; }
        #bookSelector { cursor: pointer; }
        #bookDropdown { display: none; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); border-radius: clamp(16px, 4vw, 24px); padding: 0.8vh 0; margin-top: 0.4vh; box-shadow: 0 8px 40px rgba(0,0,0,0.02); border: 1px solid rgba(255,255,255,0.3); position: absolute; bottom: calc(100% + 0.8vh); left: 0; right: 0; z-index: 10; }
        #bookDropdown .item { padding: 1.2vh 3vw; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.02); font-size: clamp(12px, 3vw, 16px); color: #0c4a6e; }
        #bookDropdown .item:last-child { border-bottom: none; }
        #bookDropdown .add-btn { padding: 1.2vh 3vw; border-top: 1px solid rgba(0,0,0,0.02); color: #34d399; font-weight: 600; cursor: pointer; font-size: clamp(12px, 3vw, 16px); }
        .arrow-icon { display: inline-block; transition: transform 0.2s; margin-left: 0.3vw; font-size: clamp(8px, 2.2vw, 12px); }
        .arrow-icon.open { transform: rotate(180deg); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.04); backdrop-filter: blur(16px); align-items: center; justify-content: center; z-index: 400; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: rgba(255,255,255,0.7); backdrop-filter: blur(28px); border-radius: clamp(32px, 10vw, 52px); padding: 3vh 5vw; max-width: 400px; width: 86%; box-shadow: 0 30px 80px rgba(0,0,0,0.02); border: 1px solid rgba(255,255,255,0.3); }
        .modal-box h3 { color: #0c4a6e; margin-bottom: 0.6vh; font-size: clamp(17px, 4.5vw, 24px); }
        .modal-box input { width: 100%; padding: 1.8vh 4vw; border-radius: 40px; border: 2px solid rgba(0,0,0,0.03); font-size: clamp(14px, 3.8vw, 20px); margin: 1.6vh 0; outline: none; transition: 0.15s; background: rgba(255,255,255,0.3); backdrop-filter: blur(4px); }
        .modal-box input:focus { border-color: #34d399; background: rgba(255,255,255,0.6); }
        .modal-btns { display: flex; gap: 2.5vw; }
        .modal-btns button { flex: 1; padding: 1.4vh 0; border: none; border-radius: 40px; font-weight: 600; font-size: clamp(14px, 3.6vw, 18px); cursor: pointer; transition: 0.1s; }
        .modal-btns button:active { transform: scale(0.94); }
        .btn-cancel { background: rgba(240,249,255,0.4); backdrop-filter: blur(4px); color: #38bdf8; }
        .btn-confirm { background: linear-gradient(135deg, #34d399, #22d3ee); color: white; box-shadow: 0 4px 20px rgba(52,211,153,0.08); }
        .record-actions { flex-direction: column; }
        .record-actions button { width: 100%; padding: 1.4vh 0; border: none; border-radius: 40px; font-weight: 600; font-size: clamp(14px, 3.6vw, 18px); cursor: pointer; }
        .record-actions .edit-record { background: linear-gradient(135deg, #34d399, #22d3ee); color: white; }
        .record-actions .delete-record { background: rgba(252,228,236,0.7); color: #f472b6; }
        .record-actions .cancel-record { background: rgba(240,249,255,0.5); color: #64748b; }
        .toast { position: fixed; top: 4vh; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); color: white; padding: 1.2vh 5vw; border-radius: 40px; font-size: clamp(13px, 3.4vw, 18px); z-index: 500; opacity: 0; transition: 0.25s; pointer-events: none; border: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
        .toast.show { opacity: 1; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>

<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
<div class="app-container">

            <svg viewBox="0 0 400 70" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
                <circle cx="50" cy="20" r="2.5" fill="#fcd34d" class="twinkle" style="animation-delay:0.0s"/>
                <circle cx="120" cy="14" r="2" fill="#fcd34d" class="twinkle" style="animation-delay:0.4s"/>
                <circle cx="210" cy="10" r="2.8" fill="#fcd34d" class="twinkle" style="animation-delay:0.8s"/>
                <circle cx="320" cy="18" r="2.2" fill="#fcd34d" class="twinkle" style="animation-delay:0.2s"/>
                <circle cx="370" cy="30" r="1.8" fill="#fcd34d" class="twinkle" style="animation-delay:0.6s"/>
                <circle cx="30" cy="48" r="2" fill="#fcd34d" class="twinkle" style="animation-delay:1.0s"/>
                <circle cx="180" cy="35" r="1.5" fill="#fcd34d" class="twinkle" style="animation-delay:0.3s"/>

        <h3>📒 新建账本</h3>
        <input type="text" id="newBookInput" placeholder="输入名称" maxlength="12">

<script src="summary.js"></script>
<script>
    (function() {
        // ===== 仅左滑返回首页（右滑无动作） =====
        var startX = 0;
        var startY = 0;
        document.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });
        
        document.addEventListener('touchend', function(e) {
            var endX = e.changedTouches[0].clientX;
            var endY = e.changedTouches[0].clientY;
            var deltaX = startX - endX;
            var deltaY = Math.abs(startY - endY);
            if (deltaX > 80 && deltaX > deltaY * 1.5) {
                window.location.href = 'index.html';
            }
        }, { passive: true });
    })();
    
    (function() {
        var BOOKS_KEY = 'my_books_data', CURRENT_KEY = 'my_current_book';
        function getBooks() { try { var r = localStorage.getItem(BOOKS_KEY); if (!r) { var d = { '账本': { records: [] } }; localStorage.setItem(BOOKS_KEY, JSON.stringify(d)); return d; } return JSON.parse(r); } catch { return { '账本': { records: [] } }; } }
        function saveBooks(b) { try { localStorage.setItem(BOOKS_KEY, JSON.stringify(b)); return true; } catch(e) { showToast('❌ 保存失败，请先导出备份'); return false; } }
        function getCurrentBook() { var n = localStorage.getItem(CURRENT_KEY); var b = getBooks(); if (!n || !b[n]) { var f = Object.keys(b)[0] || '账本'; localStorage.setItem(CURRENT_KEY, f); return f; } return n; }
        function loadData() { var b = getBooks(); var c = getCurrentBook(); if (!b[c]) b[c] = { records: [] }; return b[c]; }
        function saveData(d) { var b = getBooks(); var c = getCurrentBook(); b[c] = d; return saveBooks(b); }
        function vibrate() { if (navigator.vibrate) navigator.vibrate(6); }
        function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]; }); }
        function formatDate(s) { var d = new Date(s); var wk = ['日','一','二','三','四','五','六']; return (d.getMonth()+1) + '月' + d.getDate() + '日 周' + wk[d.getDay()]; }
        function getEmoji(cat) {
            var map = { '餐饮':'🍜','咖啡':'🦌','水果':'🍎','零食':'🍿','购物':'🛍️','生活':'🏠','住房':'🏢','交通':'🚝','社交':'👥','娱乐':'🎮','书籍':'📚','学习':'📖','医疗':'💊','宠物':'🐾','服饰':'👕','玩具':'🧸','旅行':'✈️','汽车':'🚘','快递':'📦','维修':'🔧','转账':'📱','垫付':'💳','游戏':'🎯','余转':'🔄','工资':'💼','礼金':'🎁','理财':'📈','奖金':'💰','兼职':'👨‍💻','彩票':'🎰','摆摊':'🧺','退款':'💸' };
            return map[cat] || '📦';
        }
        var currentMonth = new Date();
        function updateNumberDisplay(element, value) {
            element.textContent = value;
            var numStr = String(value).replace(/[¥,.\-]/g, '');
            if (numStr.length >= 6) { element.classList.add('large-number'); } else { element.classList.remove('large-number'); }
        }
        function renderStats() {
            var d = loadData();
            var y = currentMonth.getFullYear();
            var m = String(currentMonth.getMonth()+1).padStart(2,'0');
            var p = y + '-' + m;
            var inc=0, exp=0;
            d.records.forEach(function(r) { if (r.date && r.date.startsWith(p)) { if (r.type==='income') inc += Number(r.amount); else exp += Number(r.amount); } });
            updateNumberDisplay(document.getElementById('totalIncome'), '¥'+inc.toFixed(2));
            updateNumberDisplay(document.getElementById('totalExpense'), '¥'+exp.toFixed(2));
            updateNumberDisplay(document.getElementById('totalBalance'), '¥'+(inc-exp).toFixed(2));
            document.getElementById('monthDisplay').textContent = y + '年' + Number(m) + '月';
        }
        function renderBills() {
            var d = loadData();
            var y = currentMonth.getFullYear();
            var m = String(currentMonth.getMonth()+1).padStart(2,'0');
            var p = y + '-' + m;
            var mr = d.records.filter(function(r) { return r.date && r.date.startsWith(p); });
            var c = document.getElementById('billList');
            if (mr.length === 0) { c.innerHTML = '<div class="empty-state"><span class="emoji">🌊</span>本月还没有记录<br><span style="font-size:clamp(11px,2.8vw,15px);">点击 ＋ 开始记账</span></div>'; return; }
            var groups = {};
            var renderedRecordIds = [];
            mr.forEach(function(r) { if (!groups[r.date]) groups[r.date] = []; groups[r.date].push(r); });
            var sorted = Object.keys(groups).sort(function(a,b){return b.localeCompare(a);});
            var html = '';
            sorted.forEach(function(date) {
                var items = groups[date];
                var di=0, de=0;
                items.forEach(function(r) { if(r.type==='income') di+=Number(r.amount); else de+=Number(r.amount); });
                html += '<div class="day-group"><div class="day-header"><span>' + formatDate(date) + '</span><span>+' + di.toFixed(2) + ' -' + de.toFixed(2) + '</span></div>';
                items.forEach(function(r) {
                    var emoji = getEmoji(r.category);
                    var cls = r.type==='income'?'income':'expense';
                    var sign = r.type==='income'?'+':'-';
                    var recordIndex = renderedRecordIds.push(r.id) - 1;
                    html += '<div class="bill-item" data-record-index="' + recordIndex + '"><div class="bill-icon ' + cls + '">' + emoji + '</div><div class="bill-info"><div class="bill-category">' + escapeHtml(r.category) + '</div><div class="bill-note">' + escapeHtml(r.note||r.category) + '</div></div><div class="bill-amount ' + cls + '">' + sign + Number(r.amount).toFixed(2) + '</div></div>';
                });
                html += '</div>';
            });
            c.innerHTML = html;
            c.querySelectorAll('.bill-item').forEach(function(item) {
                item.addEventListener('click', function() {
                    var id = renderedRecordIds[Number(this.dataset.recordIndex)];
                    if (id) window.location.href = 'add.html?book=' + encodeURIComponent(getCurrentBook()) + '&edit=' + encodeURIComponent(id);
                });
            });
        }
        function renderBookDropdown() {
            var b = getBooks();
            var c = getCurrentBook();
            var list = document.getElementById('dropdownList');
            var html = '';
            var bookNames = Object.keys(b);
            bookNames.forEach(function(name, index) {
                var active = name===c ? '✅ ' : '';
                var del = bookNames.length>1 ? '<span class="delete-book" style="color:#f472b6;margin-left:1.5vw;cursor:pointer;">✕</span>' : '';
                html += '<div class="item" data-book-index="' + index + '"><span>' + active + escapeHtml(name) + '</span>' + del + '</div>';
            });
            list.innerHTML = html;
            list.querySelectorAll('.item').forEach(function(item) {
                item.addEventListener('click', function() { switchBook(bookNames[Number(this.dataset.bookIndex)]); });
                var deleteBtn = item.querySelector('.delete-book');
                if (deleteBtn) deleteBtn.addEventListener('click', function(e) { e.stopPropagation(); deleteBook(bookNames[Number(item.dataset.bookIndex)]); });
            });
            document.getElementById('currentBookName').textContent = c;
        }
        function renderAll() { renderStats(); renderBills(); renderBookDropdown(); }
        window.switchBook = function(name) { localStorage.setItem(CURRENT_KEY, name); renderAll(); showToast('切换到：' + name); vibrate(); document.getElementById('bookDropdown').style.display = 'none'; };
        window.deleteBook = function(name) {
            var b = getBooks();
            if (Object.keys(b).length <= 1) { showToast('至少保留一个账本'); return; }
            if (!confirm('删除"' + name + '"？')) return;
            delete b[name];
            if (!saveBooks(b)) return;
            var f = Object.keys(b)[0];
            localStorage.setItem(CURRENT_KEY, f);
            renderAll();
            showToast('已删除：'+name);
            vibrate();
        };
        function createBook(name) {
            name = name.trim();
            if (!name) { showToast('请输入名称'); return false; }
            var b = getBooks();
            if (b[name]) { showToast('账本已存在'); return false; }
            b[name] = { records: [] };
            if (!saveBooks(b)) return false;
            localStorage.setItem(CURRENT_KEY, name);
            renderAll();
            showToast('✅ 创建：'+name);
            vibrate();
            return true;
        }
        function goToAdd() { window.location.href = 'add.html?book=' + encodeURIComponent(getCurrentBook()); }
        function goToStats() { localStorage.setItem('stats_target_book', getCurrentBook()); window.location.href = 'stats.html'; }
        function goToDataManage() { window.location.href = 'data-manage.html'; }
        var toastTimer;
        function showToast(msg) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
        }
        window.showToast = showToast;
        window.addEventListener('bill-summary-updated', function(event) {
            renderAll();
            var reduced = event.detail && Number(event.detail.reduced || 0);
            if (reduced > 0) showToast('✅ 已自动汇总，减少 ' + reduced + ' 条记录');
        });
        document.addEventListener('DOMContentLoaded', function() {
            renderAll();
            document.getElementById('addBtn').addEventListener('click', goToAdd);
            document.getElementById('statsEntry').addEventListener('click', goToStats);
            document.getElementById('dataManageBtn').addEventListener('click', goToDataManage);
            var bookSelector = document.getElementById('bookSelector');
            var dd = document.getElementById('bookDropdown');
            var arrow = document.getElementById('bookArrow');
            bookSelector.addEventListener('click', function(e) {
                e.stopPropagation();
                var isOpen = dd.style.display === 'block';
                dd.style.display = isOpen ? 'none' : 'block';
                arrow.classList.toggle('open', !isOpen);
                vibrate();
            });
            document.addEventListener('click', function() { dd.style.display = 'none'; arrow.classList.remove('open'); });
            document.getElementById('addBookBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                document.getElementById('modalOverlay').classList.add('open');
                document.getElementById('newBookInput').value = '';
                setTimeout(function() { document.getElementById('newBookInput').focus(); }, 100);
            });
            document.getElementById('modalCancel').addEventListener('click', function() { document.getElementById('modalOverlay').classList.remove('open'); });
            document.getElementById('modalConfirm').addEventListener('click', function() {
                var name = document.getElementById('newBookInput').value.trim();
                if (createBook(name)) document.getElementById('modalOverlay').classList.remove('open');
            });
            document.getElementById('newBookInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('modalConfirm').click(); });
            document.getElementById('prevMonth').addEventListener('click', function() { currentMonth.setMonth(currentMonth.getMonth()-1); renderAll(); vibrate(); });
            document.getElementById('nextMonth').addEventListener('click', function() { currentMonth.setMonth(currentMonth.getMonth()+1); renderAll(); vibrate(); });
        });
    })();
</script>
</body>
</html>
