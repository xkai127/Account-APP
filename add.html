<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>记一笔</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; min-height: 100vh; min-height: 100dvh; background: #f5f9fc; display: flex; justify-content: center; align-items: center; padding: 0; margin: 0; overflow: hidden; position: relative; }
        body::before { content: ''; position: fixed; top: -30%; left: -20%; width: 70%; height: 70%; background: radial-gradient(circle at 20% 30%, rgba(52,211,153,0.06) 0%, rgba(56,189,248,0.04) 40%, transparent 70%); border-radius: 50%; pointer-events: none; animation: floatGlow 16s ease-in-out infinite alternate; z-index: 0; filter: blur(60px); }
        body::after { content: ''; position: fixed; bottom: -20%; right: -15%; width: 60%; height: 60%; background: radial-gradient(circle at 70% 60%, rgba(56,189,248,0.05) 0%, rgba(52,211,153,0.03) 40%, transparent 70%); border-radius: 50%; pointer-events: none; animation: floatGlow 20s ease-in-out infinite alternate-reverse; z-index: 0; filter: blur(60px); }
        @keyframes floatGlow { 0% { transform: translate(0,0) scale(1); opacity:0.5; } 100% { transform: translate(30px,-20px) scale(1.1); opacity:0.8; } }
        .bubble { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; border: 1px solid rgba(255,255,255,0.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: inset 0 -8px 30px rgba(255,255,255,0.2), 0 8px 40px rgba(52,211,153,0.03); animation: bubbleFloat 22s ease-in-out infinite alternate; }
        .bubble::after { content: ''; position: absolute; top: 12%; left: 22%; width: 35%; height: 22%; background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%); border-radius: 50%; transform: rotate(-25deg); }
        .bubble:nth-child(1) { width: 30vmin; height: 30vmin; top: 2%; left: -2%; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.3), rgba(52,211,153,0.03) 60%); animation-duration: 24s; }
        .bubble:nth-child(2) { width: 22vmin; height: 22vmin; bottom: 10%; right: 2%; background: radial-gradient(circle at 40% 25%, rgba(255,255,255,0.35), rgba(56,189,248,0.04) 60%); animation-duration: 28s; animation-delay: -5s; }
        .bubble:nth-child(3) { width: 14vmin; height: 14vmin; top: 40%; left: 80%; background: radial-gradient(circle at 35% 20%, rgba(255,255,255,0.4), rgba(52,211,153,0.04) 60%); animation-duration: 20s; animation-delay: -9s; }
        .bubble:nth-child(4) { width: 18vmin; height: 18vmin; top: 18%; right: 18%; background: radial-gradient(circle at 25% 20%, rgba(255,255,255,0.25), rgba(56,189,248,0.03) 60%); animation-duration: 26s; animation-delay: -3s; }
        @keyframes bubbleFloat { 0% { transform: translate(0,0) scale(1) rotate(0deg); opacity:0.4; } 100% { transform: translate(-20px,-25px) scale(1.06) rotate(6deg); opacity:0.8; } }
        .app-container { width: 100%; height: 100vh; height: 100dvh; background: rgba(255,255,255,0.50); backdrop-filter: blur(32px) saturate(1.6); -webkit-backdrop-filter: blur(32px) saturate(1.6); border-radius: 0; padding: 2.5vh 2.8vw 1.8vh; box-shadow: 0 20px 80px rgba(0,0,0,0.02), 0 8px 40px rgba(52,211,153,0.03), inset 0 1px 0 rgba(255,255,255,0.7); border: none; position: relative; z-index: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-fixed { flex-shrink: 0; position: relative; z-index: 2; }
        .bottom-fixed { flex-shrink: 0; position: relative; z-index: 2; padding-top: 1.2vh; margin: 0 -2.8vw; padding-left: 2.8vw; padding-right: 2.8vw; border-top: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); backdrop-filter: blur(4px); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6vh; }
        .header h1 { font-size: clamp(16px, 4.5vw, 22px); font-weight: 700; color: #0c4a6e; }
        .header .back { font-size: clamp(20px, 5.5vw, 28px); background: rgba(255,255,255,0.4); backdrop-filter: blur(12px); padding: 0.2vh 3vw; border-radius: 30px; cursor: pointer; border: 1px solid rgba(255,255,255,0.3); line-height: 1.4; }
        .header .back:active { transform: scale(0.92); background: rgba(255,255,255,0.7); }
        .book-bar { text-align: center; font-size: clamp(10px, 2.6vw, 14px); color: #64748b; margin-bottom: 0.4vh; }
        .book-bar span { background: linear-gradient(135deg, #34d399, #22d3ee); color: white; padding: 0.2vh 3vw; border-radius: 40px; }
        .amount-display { text-align: center; margin: 0.2vh 0 0.4vh; }
        .amount-display .currency { font-size: clamp(14px, 4vw, 22px); color: #64748b; }
        .amount-display .amount { font-size: clamp(32px, 10vw, 52px); font-weight: 700; color: #0c4a6e; letter-spacing: -1px; }
        .date-row { display: flex; align-items: center; justify-content: center; gap: 1.5vw; margin: 0.2vh 0 0.4vh; }
        .date-row input[type="date"] { padding: 0.6vh 2.5vw; border: none; border-radius: 30px; background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); font-size: clamp(10px, 2.6vw, 14px); color: #0c4a6e; outline: none; border: 1px solid rgba(255,255,255,0.3); max-width: 40vw; }
        .date-row .today-btn { padding: 0.4vh 3vw; border: none; border-radius: 30px; background: linear-gradient(135deg, #34d399, #22d3ee); color: white; font-weight: 600; font-size: clamp(9px, 2.4vw, 13px); cursor: pointer; box-shadow: 0 4px 16px rgba(52,211,153,0.08); }
        .date-row .today-btn:active { transform: scale(0.92); opacity: 0.8; }
        .type-tabs { display: flex; gap: 2vw; margin: 0.2vh 0 0.4vh; }
        .type-tab { flex: 1; padding: 0.6vh 0; border: none; border-radius: 30px; font-size: clamp(11px, 3vw, 16px); font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); color: #64748b; transition: 0.15s; border: 1px solid rgba(255,255,255,0.2); }
        .type-tab:active { transform: scale(0.94); }
        .type-tab.active-expense { background: #fce4ec; color: #f472b6; border-color: #f472b6; }
        .type-tab.active-income { background: #d1fae5; color: #34d399; border-color: #34d399; }
        .scroll-area { flex: 1; overflow-y: auto; margin: 0 -0.8vw; padding: 0 0.8vw; min-height: 0; position: relative; z-index: 1; }
        .scroll-area::-webkit-scrollbar { width: 3px; }
        .scroll-area::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #34d399, #22d3ee); border-radius: 10px; }
        .category-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5vw; padding: 0.2vh 0; }
        .category-item { display: flex; flex-direction: column; align-items: center; padding: 0.4vh 0 0.2vh; border-radius: 14px; border: none; background: transparent; cursor: pointer; font-size: clamp(8px, 2vw, 11px); color: #64748b; transition: 0.1s; }
        .category-item:active { transform: scale(0.88); background: rgba(52,211,153,0.06); }
        .category-item .emoji { font-size: clamp(16px, 5vw, 28px); margin-bottom: 0; }
        .category-item .name { font-size: clamp(7px, 1.8vw, 10px); color: #64748b; }
        .category-item.selected { background: rgba(52,211,153,0.10); border-radius: 14px; }
        .category-item.selected .name { color: #34d399; font-weight: 600; }
        .note-row { margin: 0.3vh 0 0.3vh; }
        .note-row input { width: 100%; padding: 0.8vh 3.5vw; border: none; border-radius: 30px; background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); font-size: clamp(10px, 2.6vw, 14px); outline: none; border: 1px solid rgba(255,255,255,0.3); }
        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8vw; padding: 0.4vh 0; }
        .numpad button { padding: 1.2vh 0; border: none; border-radius: clamp(10px, 3vw, 18px); background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); font-size: clamp(16px, 5vw, 28px); font-weight: 500; color: #0c4a6e; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); transition: 0.1s; min-height: clamp(36px, 8vh, 56px); }
        .numpad button:active { transform: scale(0.90); background: rgba(255,255,255,0.7); }
        .numpad .btn-delete { font-size: clamp(14px, 4vw, 22px); color: #64748b; }
        .numpad .btn-clear { font-size: clamp(12px, 3.5vw, 20px); color: #f472b6; font-weight: 600; }
        .numpad .btn-done { background: linear-gradient(135deg, #34d399, #22d3ee); color: white; font-size: clamp(14px, 4.5vw, 24px); font-weight: 700; box-shadow: 0 4px 20px rgba(52,211,153,0.12); border: none; }
        .numpad .btn-done:active { transform: scale(0.90); opacity: 0.8; }
        .edit-delete-row { display: none; justify-content: flex-end; margin-bottom: 0.6vh; }
        .edit-delete-row.show { display: flex; }
        .edit-delete-btn { border: 1px solid rgba(241,111,152,.22); border-radius: 999px; padding: 0.6vh 4vw; color: #df557f; background: #fff0f5; font-size: clamp(11px, 2.8vw, 14px); font-weight: 700; cursor: pointer; }
        .edit-delete-btn:active { transform: scale(.94); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.04); backdrop-filter: blur(16px); align-items: center; justify-content: center; z-index: 400; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: rgba(255,255,255,0.7); backdrop-filter: blur(28px); border-radius: clamp(32px, 10vw, 52px); padding: 3vh 5vw; max-width: 400px; width: 86%; box-shadow: 0 30px 80px rgba(0,0,0,0.02); border: 1px solid rgba(255,255,255,0.3); text-align: center; }
        .modal-box h3 { color: #0c4a6e; font-size: clamp(17px, 4.5vw, 24px); }
        .modal-box .sub { color: #64748b; font-size: clamp(12px, 3.2vw, 17px); margin: 0.6vh 0 1.6vh; }
        .modal-btns { display: flex; gap: 2.5vw; }
        .modal-btns button { flex: 1; padding: 1.4vh 0; border: none; border-radius: 40px; font-weight: 600; font-size: clamp(13px, 3.6vw, 18px); cursor: pointer; transition: 0.1s; }
        .modal-btns button:active { transform: scale(0.94); }
        .btn-cancel { background: rgba(240,249,255,0.4); backdrop-filter: blur(4px); color: #38bdf8; }
        .btn-confirm { background: linear-gradient(135deg, #34d399, #22d3ee); color: white; box-shadow: 0 4px 20px rgba(52,211,153,0.08); }
        .toast { position: fixed; top: 4vh; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); color: white; padding: 1.2vh 5vw; border-radius: 40px; font-size: clamp(13px, 3.4vw, 18px); z-index: 500; opacity: 0; transition: 0.25s; pointer-events: none; border: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
        .toast.show { opacity: 1; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="page-add">
<div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
<div class="app-container">
    <div class="top-fixed">
        <div class="header"><span class="back" id="backBtn">‹</span><h1 id="pageTitle">✨ 记一笔</h1><span style="width:8vw;"></span></div>
        <div class="book-bar">📒 当前账本：<span id="bookName">账本</span></div>
        <div class="amount-display"><span class="currency">¥</span><span class="amount" id="amountDisplay">0.00</span></div>
        <div class="date-row">
            <input type="date" id="dateInput">
            <button class="today-btn" id="todayBtn">今天</button>
        </div>
        <div class="type-tabs">
            <button class="type-tab active-expense" data-type="expense" id="expenseTab">支出</button>
            <button class="type-tab" data-type="income" id="incomeTab">收入</button>
        </div>
    </div>
    <div class="scroll-area">
        <div class="category-grid" id="categoryGrid"></div>
        <div class="note-row"><input id="noteInput" placeholder="备注（选填）" maxlength="20"></div>
    </div>
    <div class="bottom-fixed">
        <div class="edit-delete-row" id="editDeleteRow">
            <button class="edit-delete-btn" id="deleteRecordBtn" type="button">🗑️ 删除这条记录</button>
        </div>
        <div class="numpad" id="numpad">
            <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
            <button class="btn-delete" data-value="delete">⌫</button>
            <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
            <button class="btn-clear" data-value="clear">C</button>
            <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
            <button data-value=".">.</button>
            <button data-value="0">0</button><button data-value="00">00</button>
            <button data-value="back">←</button>
            <button class="btn-done" id="doneBtn" data-value="done">完成</button>
        </div>
    </div>
</div>
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box"><h3>⚠️ 确定离开？</h3><div class="sub">当前记录尚未保存</div><div class="modal-btns"><button class="btn-cancel" id="stayBtn">继续记账</button><button class="btn-confirm" id="leaveBtn">确定离开</button></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
    var BOOKS_KEY = 'my_books_data', CURRENT_KEY = 'my_current_book';
    function getBooks() { try { var r = localStorage.getItem(BOOKS_KEY); if (!r) { var d = { '账本': { records: [] } }; localStorage.setItem(BOOKS_KEY, JSON.stringify(d)); return d; } return JSON.parse(r); } catch { return { '账本': { records: [] } }; } }
    function getCurrentBook() { var n = localStorage.getItem(CURRENT_KEY); var b = getBooks(); if (!n || !b[n]) { var f = Object.keys(b)[0] || '账本'; localStorage.setItem(CURRENT_KEY, f); return f; } return n; }
    function loadData() { var b = getBooks(); var c = getCurrentBook(); if (!b[c]) b[c] = { records: [] }; return b[c]; }
    function saveData(d) { var b = getBooks(); var c = getCurrentBook(); b[c] = d; try { localStorage.setItem(BOOKS_KEY, JSON.stringify(b)); return true; } catch(e) { showToast('❌ 保存失败，请先导出备份'); return false; } }
    function notifyStatsUpdate() { try { localStorage.setItem('stats_needs_refresh', Date.now().toString()); } catch(e) {} }
    var EXPENSE = [ { emoji: '🍜', name: '餐饮' }, { emoji: '🦌', name: '咖啡' }, { emoji: '🍎', name: '水果' }, { emoji: '🍿', name: '零食' }, { emoji: '🛍️', name: '购物' }, { emoji: '🏠', name: '生活' }, { emoji: '🏢', name: '住房' }, { emoji: '🚝', name: '交通' }, { emoji: '👥', name: '社交' }, { emoji: '🎮', name: '娱乐' }, { emoji: '📚', name: '书籍' }, { emoji: '📖', name: '学习' }, { emoji: '💊', name: '医疗' }, { emoji: '🐾', name: '宠物' }, { emoji: '👕', name: '服饰' }, { emoji: '🧸', name: '玩具' }, { emoji: '✈️', name: '旅行' }, { emoji: '🚘', name: '汽车' }, { emoji: '📦', name: '快递' }, { emoji: '🔧', name: '维修' }, { emoji: '📱', name: '转账' }, { emoji: '💳', name: '垫付' }, { emoji: '🎯', name: '游戏' }, { emoji: '🔄', name: '余转' } ];
    var INCOME = [ { emoji: '💼', name: '工资' }, { emoji: '🎁', name: '礼金' }, { emoji: '📈', name: '理财' }, { emoji: '💰', name: '奖金' }, { emoji: '👨‍💻', name: '兼职' }, { emoji: '🎰', name: '彩票' }, { emoji: '🧺', name: '摆摊' }, { emoji: '💸', name: '退款' }, { emoji: '🔄', name: '余转' } ];
    function dedup(arr) { var s = new Set(); return arr.filter(function(c) { if (s.has(c.name)) return false; s.add(c.name); return true; }); }
    var EXPENSE_DEDUP = dedup(EXPENSE), INCOME_DEDUP = dedup(INCOME);
    var currentType = 'expense', currentCategory = '餐饮', amountInput = '0', hasUnsaved = false, editingRecordId = null;
    function getCategories() { return currentType === 'expense' ? EXPENSE_DEDUP : INCOME_DEDUP; }
    function vibrate() { if (navigator.vibrate) navigator.vibrate(6); }
    function getTodayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function updateAmountDisplay() { var n = parseFloat(amountInput) || 0; document.getElementById('amountDisplay').textContent = n.toFixed(2); if (n > 0 || document.getElementById('noteInput').value.trim()) hasUnsaved = true; }
    function renderCategories() {
        var grid = document.getElementById('categoryGrid');
        var cats = getCategories();
        var html = '';
        cats.forEach(function(c) { var sel = currentCategory === c.name ? 'selected' : ''; html += '<button class="category-item ' + sel + '" data-category="' + c.name + '"><span class="emoji">' + c.emoji + '</span><span class="name">' + c.name + '</span></button>'; });
        grid.innerHTML = html;
        grid.querySelectorAll('.category-item').forEach(function(btn) { btn.addEventListener('click', function() { vibrate(); currentCategory = this.dataset.category; renderCategories(); }); });
    }
    function saveRecord() {
        var note = document.getElementById('noteInput').value.trim();
        var amount = parseFloat(amountInput);
        var dateInput = document.getElementById('dateInput');
        var recordDate = dateInput.value || getTodayStr();
        if (isNaN(amount) || amount <= 0) { showToast('⚠️ 请输入有效金额'); vibrate(); return false; }
        var data = loadData();
        var newRecord = { id: editingRecordId || Date.now() + '_' + Math.random().toString(36).substr(2,6), note: note || currentCategory, amount: parseFloat(amount), type: currentType, category: currentCategory, date: recordDate, time: new Date().toLocaleString('zh-CN', { hour12: false }) };
        if (editingRecordId) {
            var recordIndex = data.records.findIndex(function(r) { return r.id === editingRecordId; });
            if (recordIndex === -1) { showToast('⚠️ 未找到要修改的记录'); return false; }
            newRecord.time = data.records[recordIndex].time || newRecord.time;
            data.records[recordIndex] = newRecord;
        } else {
            data.records.unshift(newRecord);
        }
        if (!saveData(data)) return false;
        notifyStatsUpdate();
        showToast((editingRecordId ? '✅ 修改成功：' : '✅ 已记账：') + currentCategory + ' ' + (currentType === 'income' ? '+' : '-') + '¥' + parseFloat(amount).toFixed(2));
        vibrate();
        hasUnsaved = false;
        amountInput = '0';
        document.getElementById('noteInput').value = '';
        updateAmountDisplay();
        setTimeout(function() { window.location.href = 'bill.html'; }, 400);
        return true;
    }
    function deleteEditingRecord() {
        if (!editingRecordId) return;
        if (!confirm('确定删除这条记录吗？')) return;
        var data = loadData();
        var before = data.records.length;
        data.records = data.records.filter(function(r) { return r.id !== editingRecordId; });
        if (data.records.length === before) { showToast('⚠️ 记录不存在'); return; }
        if (!saveData(data)) return;
        notifyStatsUpdate();
        hasUnsaved = false;
        vibrate();
        showToast('🗑️ 已删除');
        setTimeout(function() { window.location.href = 'bill.html'; }, 350);
    }
    function handleNumpadInput(value) {
        vibrate();
        if (value === 'delete' || value === 'back') { amountInput = amountInput.length > 1 ? amountInput.slice(0, -1) : '0'; }
        else if (value === 'clear') { amountInput = '0'; }
        else if (value === 'done') { saveRecord(); return; }
        else if (value === '.') { if (!amountInput.includes('.')) amountInput += '.'; }
        else {
            if (amountInput === '0' && value !== '.') amountInput = value;
            else {
                if (amountInput.includes('.')) { var parts = amountInput.split('.'); if (parts[1] && parts[1].length >= 2) return; }
                if (amountInput.replace('.', '').length >= 10) return;
                amountInput += value;
            }
        }
        updateAmountDisplay();
    }
    var toastTimer; function showToast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function() { el.classList.remove('show'); }, 1800); }
    function goBack() {
        var amount = parseFloat(amountInput) || 0;
        var note = document.getElementById('noteInput').value.trim();
        if (amount > 0 || note) { document.getElementById('modalOverlay').classList.add('open'); }
        else { window.location.href = 'bill.html'; }
    }
    document.addEventListener('DOMContentLoaded', function() {
        var params = new URLSearchParams(window.location.search);
        var book = params.get('book') || getCurrentBook();
        editingRecordId = params.get('edit');
        document.getElementById('bookName').textContent = book;
        if (book) localStorage.setItem(CURRENT_KEY, book);
        var today = getTodayStr();
        document.getElementById('dateInput').value = today;
        document.getElementById('dateInput').max = today;
        currentCategory = EXPENSE_DEDUP[0]?.name || '餐饮';
        if (editingRecordId) {
            var editingRecord = loadData().records.find(function(r) { return r.id === editingRecordId; });
            if (editingRecord) {
                currentType = editingRecord.type === 'income' ? 'income' : 'expense';
                currentCategory = editingRecord.category || (currentType === 'income' ? '工资' : '餐饮');
                amountInput = String(editingRecord.amount || 0);
                document.getElementById('dateInput').value = editingRecord.date || today;
                document.getElementById('noteInput').value = editingRecord.note || '';
                document.getElementById('expenseTab').className = currentType === 'expense' ? 'type-tab active-expense' : 'type-tab';
                document.getElementById('incomeTab').className = currentType === 'income' ? 'type-tab active-income' : 'type-tab';
                document.getElementById('pageTitle').textContent = '✏️ 修改记录';
                document.getElementById('doneBtn').textContent = '保存';
                document.getElementById('editDeleteRow').classList.add('show');
            } else {
                editingRecordId = null;
                showToast('⚠️ 记录不存在');
            }
        }
        renderCategories(); updateAmountDisplay();
        hasUnsaved = false;
        document.getElementById('todayBtn').addEventListener('click', function() { document.getElementById('dateInput').value = getTodayStr(); vibrate(); showToast('📅 已切换到今天'); });
        document.getElementById('expenseTab').addEventListener('click', function() { vibrate(); currentType = 'expense'; this.className = 'type-tab active-expense'; document.getElementById('incomeTab').className = 'type-tab'; currentCategory = EXPENSE_DEDUP[0]?.name || '餐饮'; renderCategories(); });
        document.getElementById('incomeTab').addEventListener('click', function() { vibrate(); currentType = 'income'; this.className = 'type-tab active-income'; document.getElementById('expenseTab').className = 'type-tab'; currentCategory = INCOME_DEDUP[0]?.name || '工资'; renderCategories(); });
        document.getElementById('numpad').querySelectorAll('button[data-value]').forEach(function(btn) { btn.addEventListener('click', function() { handleNumpadInput(this.dataset.value); }); });
        document.getElementById('noteInput').addEventListener('input', function() { hasUnsaved = true; });
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.getElementById('deleteRecordBtn').addEventListener('click', deleteEditingRecord);
        document.getElementById('stayBtn').addEventListener('click', function() { document.getElementById('modalOverlay').classList.remove('open'); vibrate(); });
        document.getElementById('leaveBtn').addEventListener('click', function() { document.getElementById('modalOverlay').classList.remove('open'); window.location.href = 'bill.html'; });
        document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) { this.classList.remove('open'); vibrate(); } });
        window.addEventListener('beforeunload', function(e) { if (hasUnsaved) { e.preventDefault(); e.returnValue = ''; } });
    });
</script>
</body>
</html>
